name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  agent:
    name: Agent (build, vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: agent/go.sum
      - run: go build ./...
        working-directory: agent
      - run: go vet ./...
        working-directory: agent

  server:
    name: Server (typecheck, smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: wms
          POSTGRES_DB: wms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wms -d wms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Plain Postgres here on purpose: it exercises the non-TimescaleDB
      # fallback paths in the migrations.
      DATABASE_URL: postgresql://wms:wms@127.0.0.1:5432/wms
      JWT_SECRET: ci_user_secret_that_is_at_least_32_chars_long
      AGENT_JWT_SECRET: ci_agent_secret_that_is_at_least_32_chars
      CORS_ORIGIN: http://127.0.0.1:3000
      PORT: "4000"
      API_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server

      - name: Run migrations
        run: node scripts/migrate.js
        working-directory: server

      - name: Start server
        run: |
          npx tsx src/main.ts > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4000/health > /dev/null; then
              echo "server up"; exit 0
            fi
            sleep 1
          done
          echo "server failed to start"; cat /tmp/server.log; exit 1
        working-directory: server

      - name: Smoke test
        run: npm run test:smoke
        working-directory: server

      - name: Server log on failure
        if: failure()
        run: cat /tmp/server.log
